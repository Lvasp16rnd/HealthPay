global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'healthpay-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'host.docker.internal:8080' # appointment-service
        - 'host.docker.internal:8081' # payment-service
        - 'host.docker.internal:8082' # notification-service
        - 'host.docker.internal:8083' # auth-service
        - 'host.docker.internal:8000' # gateway-service
