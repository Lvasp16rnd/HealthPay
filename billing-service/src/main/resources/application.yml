server:
  port: 8084

spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://localhost:5433/healthpay
    username: admin
    password: "123456test@jkaH"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: billing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.healthpay.billing_service.event.AppointmentCompletedEvent

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

# Configuracao da API externa (Health Insurance) que sera mockada
health-insurance:
  client:
    url: http://localhost:8089 # URL do nosso Mock/WireMock
